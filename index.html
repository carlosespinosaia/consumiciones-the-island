<!doctype html><html lang="es"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Consumiciones The Island</title>
<style>
:root{--bg:#0e0e10;--card:#1b1b1f;--tx:#fff;--mut:#9a9aa3;--ok:#1fb55a;--ac:#f0b429}
*{box-sizing:border-box}body{font-family:-apple-system,Helvetica,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{margin:0;font-size:22px;letter-spacing:3px;color:var(--mut);text-align:center}
.qty{display:flex;align-items:center;gap:18px}
.qty button{width:64px;height:64px;font-size:36px;border-radius:50%;border:0;background:#333;color:#fff;cursor:pointer}
.qty span{font-size:56px;min-width:80px;text-align:center;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(100%,900px)}
.card{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.card b{font-size:18px;color:var(--mut);letter-spacing:2px}.card .n{font-size:64px;font-weight:800}
.card button{width:100%;height:150px;font-size:34px;font-weight:800;border:0;border-radius:18px;background:var(--ok);color:#fff;cursor:pointer}
.card button:active{transform:scale(.98)}button:disabled{background:#555!important}
#msg{min-height:26px;font-size:18px;text-align:center}
.st{width:min(100%,900px);background:var(--card);border-radius:24px;padding:20px}
.st h2{margin:0 0 12px;font-size:16px;letter-spacing:2px;color:var(--mut)}
.kp{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}.kp div{flex:1;min-width:120px;background:#26262b;border-radius:14px;padding:12px;text-align:center}
.kp strong{display:block;font-size:34px}.kp small{color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-bottom:6px}
.bars i{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars i s{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;text-decoration:none;color:var(--tx)}
.lab{display:flex;gap:4px;font-size:11px;color:var(--mut)}.lab span{flex:1;text-align:center}
.act{display:flex;gap:10px;margin-top:16px}.act button{flex:1;padding:12px;border:0;border-radius:10px;background:#333;color:#fff;font-size:15px;cursor:pointer}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
<img src="assets/logo-the-island-tarragona.png" alt="The Island Tarragona" style="width:min(70vw,320px);background:#fff;border-radius:14px;padding:10px">
<h1>CONSUMICIONES</h1><div id="fecha" style="font-size:40px;font-weight:800;text-align:center;color:var(--ac);text-transform:capitalize"></div>
<div class="qty"><button onclick="ch(-1)">−</button><span id="q">1</span><button onclick="ch(1)">+</button></div>
<div class="row">
 <div class="card"><b>COPA</b><div class="n" id="nc">0</div><button id="bc" onclick="pr('copa')">IMPRIMIR COPA</button></div>
 <div class="card"><b>REFRESCO O CERVEZA</b><div class="n" id="nn">0</div><button id="bn" onclick="pr('refresco')">IMPRIMIR REFRESCO O CERVEZA</button></div>
</div>
<div id="msg"></div>
<div id="loc" style="display:none;width:min(100%,900px);background:#3a2a00;border:2px solid var(--ac);border-radius:16px;padding:16px;text-align:center;font-size:18px">
 Safari y otros navegadores bloquean la impresión desde esta página.<br>
 <a href="http://127.0.0.1:8765/" style="color:var(--ac);font-weight:800;font-size:22px">ABRIR VERSIÓN PARA IMPRIMIR (en el Mac de la impresora)</a><br><br>
 ¿Otro ordenador? IP del Mac: <input id="ip" placeholder="192.168.1.37" style="font-size:18px;padding:6px;width:150px"> <button onclick="goip()" style="font-size:18px;padding:6px 12px">Ir</button>
</div>
<div class="st"><h2>ESTADÍSTICA DE LA NOCHE</h2>
 <div class="kp"><div><strong id="kt">0</strong><small>Total</small></div><div><strong id="kc">0</strong><small>Copas</small></div><div><strong id="kn">0</strong><small>Refresco y cerveza</small></div><div><strong id="kp">–</strong><small>Hora punta</small></div></div>
 <div class="bars" id="bars"></div><div class="lab" id="lab"></div>
 <div class="act"><button onclick="csv()">Descargar CSV</button><button onclick="rst()">Cerrar noche / poner a cero</button></div>
</div>
<script>
let BASE=location.port==='8765'?'':'http://127.0.0.1:8765';
const PINK='island_pin';const gp=()=>{try{return localStorage.getItem(PINK)||''}catch(e){return''}};
async function api(path,o={}){o.headers=Object.assign({'X-PIN':gp()},o.headers||{});
 let r=await fetch(BASE+path,o);
 if(r.status===401){const v=prompt('PIN de la impresora (6 cifras):');if(v){try{localStorage.setItem(PINK,v.trim())}catch(e){}o.headers['X-PIN']=v.trim();r=await fetch(BASE+path,o)}}
 return r}
async function findBase(){if(location.port==='8765'||location.protocol==='file:')return;
 try{const t=await (await fetch('/tunnel.json',{cache:'no-store'})).json();if(t.url){const ok=await fetch(t.url+'/stats',{headers:{'X-PIN':gp()}}).catch(()=>null);if(ok)BASE=t.url}}catch(e){}}
let q=1;const $=id=>document.getElementById(id);
let DATA=[];const load=()=>DATA;
async function refresh(){try{DATA=await (await api('/stats')).json();render()}catch(e){$('msg').textContent='Sin conexión con la impresora (¿app abierta?)'}}
function ch(d){q=Math.min(50,Math.max(1,q+d));$('q').textContent=q}
// la "noche" va de las 18:00 a las 12:00 del día siguiente: el eje de horas empieza a las 18
const ORDER=[18,19,20,21,22,23,0,1,2,3,4,5,6];
function render(){const a=load();let c=0,n=0;const h={};
 a.forEach(e=>{e.t==='copa'?c+=e.n:n+=e.n;const k=new Date(e.ts).getHours();h[k]=(h[k]||0)+e.n});
 $('nc').textContent=c;$('nn').textContent=n;$('kc').textContent=c;$('kn').textContent=n;$('kt').textContent=c+n;
 const mx=Math.max(1,...ORDER.map(x=>h[x]||0));let top=null;
 ORDER.forEach(x=>{if((h[x]||0)>0&&(top===null||h[x]>h[top]))top=x});
 $('kp').textContent=top===null?'–':top+':00';
 $('bars').innerHTML=ORDER.map(x=>`<i style="height:${(h[x]||0)/mx*100}%">${h[x]?'<s>'+h[x]+'</s>':''}</i>`).join('');
 $('lab').innerHTML=ORDER.map(x=>`<span>${x}h</span>`).join('')}
async function pr(t){
 if(q>1&&!confirm('¿Imprimir '+q+' tickets de '+(t==='copa'?'COPA':'REFRESCO O CERVEZA')+'?'))return;
 ['bc','bn'].forEach(i=>$(i).disabled=true);$('msg').textContent='Enviando…';
 try{const r=await api('/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qty:q,type:t})});
  const j=await r.json();if(!j.ok)throw new Error(j.error);
  await refresh();
  $('msg').textContent='Enviado ('+q+'). Comprueba que ha salido el papel.';q=1;$('q').textContent=1;
 }catch(e){$('loc').style.display='block';$('msg').textContent='ERROR: no se pudo imprimir. ¿Está abierta la app «Tickets COPA.command» y la impresora encendida? ('+e.message+')'}
 ['bc','bn'].forEach(i=>$(i).disabled=false)}
function csv(){const a=load();const s='fecha_hora,tipo,cantidad\n'+a.map(e=>new Date(e.ts).toLocaleString('es-ES')+','+e.t+','+e.n).join('\n');
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));l.download='consumiciones-'+new Date().toISOString().slice(0,10)+'.csv';l.click()}
async function rst(){if(confirm('¿Cerrar la noche y poner todo a cero? Descarga el CSV antes si lo necesitas.')){await api('/stats/reset',{method:'POST'});refresh()}}
const fd=()=>{$('fecha').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};fd();setInterval(fd,60000);
function goip(){const v=$('ip').value.trim();if(v)location.href='http://'+v+':8765/'}
render();findBase().then(()=>{refresh();setInterval(refresh,10000)});
</script></html>
